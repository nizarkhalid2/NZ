<!DOCTYPE html>
<html lang="en" data-redirect-timezone="1" dir="ltr"><head><script id="nizar-ourdays-early-blocker">
(() => {
  // Keep Framer's native desktop drag behavior, but replace About Me's click action.
  const SELECTOR = '[data-nizar-ourdays-app="true"], [data-framer-name="about"], [name="about"], .framer-1hiogi0-container, [data-framer-name="Tips"], [name="Tips"], .framer-12rwxs8-container';
  let press = null;

  function targetFrom(node) {
    if (!(node instanceof Element)) return null;
    // Only the actual Our Days desktop app may launch the window.
    // Never walk up to arbitrary large DIVs: those can cover empty desktop
    // space and were the reason a blank click opened Our Days.
    const direct = node.closest(SELECTOR);
    if (!direct) return null;
    const r = direct.getBoundingClientRect();
    // Extra guard against accidentally matching a page-sized Framer wrapper.
    if (r.width > 260 || r.height > 260) return null;
    return direct;
  }

  function block(e) {
    e.preventDefault();
    e.stopPropagation();
    if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
  }

  function launch() {
    let tries = 0;
    const run = () => {
      if (typeof window.__nizarOpenOurDaysWindow === 'function') {
        window.__nizarOpenOurDaysWindow();
        return;
      }
      window.__nizarOurDaysPending = true;
      if (++tries < 30) setTimeout(run, 50);
    };
    run();
  }

  // IMPORTANT: do not block pointerdown. Framer needs it to drag the desktop icon.
  document.addEventListener('pointerdown', e => {
    const target = targetFrom(e.target);
    if (!target) { press = null; return; }
    press = { id:e.pointerId, x:e.clientX, y:e.clientY, at:performance.now(), target };
  }, true);

  document.addEventListener('pointerup', e => {
    if (!press || press.id !== e.pointerId) return;
    const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
    const elapsed = performance.now() - press.at;
    const wasOurDays = !!press.target;
    press = null;
    if (wasOurDays && moved <= 14 && elapsed <= 1500) {
      block(e);
      launch();
    }
  }, true);

  document.addEventListener('pointercancel', e => {
    if (press && press.id === e.pointerId) press = null;
  }, true);

  document.addEventListener('click', e => {
    if (!targetFrom(e.target)) return;
    block(e);
  }, true);
  document.addEventListener('dblclick', e => {
    if (!targetFrom(e.target)) return;
    block(e);
  }, true);
  document.addEventListener('auxclick', e => {
    if (!targetFrom(e.target)) return;
    block(e);
  }, true);
  document.addEventListener('keydown', e => {
    if ((e.key !== 'Enter' && e.key !== ' ') || !targetFrom(e.target)) return;
    block(e); launch();
  }, true);
})();
</script><script id="nizar-movies-early-blocker">
(() => {
  // Movies may launch ONLY from the visible Movies icon or its visible label.
  // Never treat a large Framer wrapper / desktop region as the Movies app.
  let press = null;

  function isMovieImage(img) {
    if (!(img instanceof HTMLImageElement)) return false;
    const src = img.getAttribute('src') || '';
    return /movies-icon\.png|PWuUiO2aouvctH4NNK1MNPe9o|sXPlJD56ya7bPccebTOcaoSqJ48/.test(src);
  }

  function isMovieLabel(el) {
    if (!(el instanceof Element)) return false;
    const t = (el.textContent || '').trim();
    return t === 'Movies' || t === 'Interstellar';
  }

  }

  function movieTarget(node) {
    if (!(node instanceof Element)) return null;

    const hot = node.closest('[data-nizar-movies-hotspot="true"]');
    if (hot instanceof HTMLElement) {
      const r = hot.getBoundingClientRect();
      if (r.width > 0 && r.height > 0 && r.width <= 190 && r.height <= 190) return hot;
    }

    const img = node.closest('img');
    if (isMovieImage(img)) return smallRoot(img);

    const text = node.closest('p,span');
    if (isMovieLabel(text)) return smallRoot(text);

    return null;
  }

  function block(e) {
    e.preventDefault();
    e.stopPropagation();
    if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
  }

  function launch() {
    window.__nizarMoviesAuthorizedAt = performance.now();
    let tries = 0;
    const run = () => {
      if (typeof window.__nizarOpenMoviesWindow === 'function') {
        window.__nizarOpenMoviesWindow();
        return;
      }
      if (++tries < 30) setTimeout(run, 50);
    };
    run();
  }

  // Keep pointerdown native so Framer drag still works when starting on the icon.
  document.addEventListener('pointerdown', e => {
    const target = movieTarget(e.target);
    if (!target) { press = null; return; }
    press = { id:e.pointerId, x:e.clientX, y:e.clientY, at:performance.now(), target };
  }, true);

  document.addEventListener('pointerup', e => {
    if (!press || press.id !== e.pointerId) return;
    const targetNow = movieTarget(e.target);
    const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
    const elapsed = performance.now() - press.at;
    const valid = !!targetNow;
    press = null;
    if (valid && moved <= 14 && elapsed <= 1500) {
      block(e);
      launch();
    }
  }, true);

  document.addEventListener('pointercancel', e => {
    if (press && press.id === e.pointerId) press = null;
  }, true);

  // Stop Framer's old click only when the user actually clicked the Movies icon/label.
  for (const type of ['click','dblclick','auxclick']) {
    document.addEventListener(type, e => {
      if (!movieTarget(e.target)) return;
      block(e);
    }, true);
  }

  document.addEventListener('keydown', e => {
    if ((e.key !== 'Enter' && e.key !== ' ') || !movieTarget(e.target)) return;
    block(e); launch();
  }, true);
})();

<style id="nizar-movies-window-style">
  [data-nizar-movies-app="true"], [name="Movies"], [data-framer-name="Movies"] { cursor: pointer !important; }

    position: fixed;

    isolation: isolate;

  #nizar-movies-window.nizar-visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #nizar-movies-window.nizar-maximized {

<script id="nizar-movies-window-patch">
(() => {
  const MOVIES_URL = "https://nizarkhalid2.github.io/try/";
  const ICON_URL = "movies-icon.png";
  let scheduled = false;
  let press = null;
  let drag = null;

  function nizarIsMovieImage(img) {
    if (!(img instanceof HTMLImageElement)) return false;
    const src = img.getAttribute('src') || '';
    return /movies-icon\.png|PWuUiO2aouvctH4NNK1MNPe9o|sXPlJD56ya7bPccebTOcaoSqJ48/.test(src);
  }

  function nizarIsMovieLabel(el) {
    if (!(el instanceof Element)) return false;
    const t = (el.textContent || '').trim();
    return t === 'Movies' || t === 'Interstellar';
  }

  function nizarMovieSmallRoot(el) {
    if (!(el instanceof Element)) return null;
    let node = el;
    let best = el;
    for (let i = 0; node && node !== document.body && i < 9; i++, node = node.parentElement) {
      if (!(node instanceof HTMLElement)) continue;
      const r = node.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      if (r.width > 190 || r.height > 190) break;
      best = node;
      if (node.matches('a,button,[role="button"],[tabindex]')) best = node;
    }
    return best instanceof Element ? best : el;
  }

  function isMoviesElement(el) {
    if (!(el instanceof Element)) return null;
    if (el.closest('#nizar-movies-window')) return null;

    const hot = el.closest('[data-nizar-movies-hotspot="true"]');
    if (hot instanceof HTMLElement) {
      const r = hot.getBoundingClientRect();
      if (r.width > 0 && r.height > 0 && r.width <= 190 && r.height <= 190) return hot;
    }

    const img = el.closest('img');
    if (nizarIsMovieImage(img)) return nizarMovieSmallRoot(img);

    const text = el.closest('p,span');
    if (nizarIsMovieLabel(text)) return nizarMovieSmallRoot(text);

    return null;
  }


  function suppressOriginalFavoritesWindow() {
    // Safety net: if Framer somehow creates its original "My Favorites" window,
    // hide the entire OS window instead of letting it sit behind Movies.
    const custom = document.getElementById('nizar-movies-window');
    if (!custom) return;

    const sections = Array.from(document.querySelectorAll('[data-framer-name="Movies-Section"], .framer-plYUb'));
    sections.forEach(section => {
      if (!(section instanceof HTMLElement) || section.closest('#nizar-movies-window')) return;

      let node = section;
      let candidate = null;
      for (let i = 0; node && node !== document.body && i < 12; i++, node = node.parentElement) {
        if (!(node instanceof HTMLElement)) continue;
        const style = getComputedStyle(node);
        const rect = node.getBoundingClientRect();
        const positionedWindow = (style.position === 'fixed' || style.position === 'absolute') && rect.width > 420 && rect.height > 260;
        const hasWindowControls = !!node.querySelector('[data-framer-name*="Window" i], [data-framer-name*="Navigation" i]');
        if (positionedWindow) { candidate = node; if (hasWindowControls) break; }
      }
      (candidate || section).style.setProperty('display', 'none', 'important');
      (candidate || section).setAttribute('data-nizar-suppressed-favorites', 'true');
    });

    // Text fallback for hydrated variants where the authored name is stripped.
    document.querySelectorAll('h1,h2,h3,p,span,div').forEach(el => {
      if ((el.textContent || '').trim() !== 'My Favorites') return;
      if (el.closest('#nizar-movies-window')) return;
      let node = el;
      for (let i = 0; node && node !== document.body && i < 12; i++, node = node.parentElement) {
        if (!(node instanceof HTMLElement)) continue;
        const style = getComputedStyle(node);
        const rect = node.getBoundingClientRect();
        if ((style.position === 'fixed' || style.position === 'absolute') && rect.width > 420 && rect.height > 260) {
          node.style.setProperty('display', 'none', 'important');
          node.setAttribute('data-nizar-suppressed-favorites', 'true');
          break;
        }
      }
    });
  }

  function closeMoviesWindow() {
    const win = document.getElementById('nizar-movies-window');
    if (!win) return;
    win.classList.remove('nizar-visible');
    setTimeout(() => win.remove(), 190);
  }

  function toggleMaximize() {
    const win = document.getElementById('nizar-movies-window');
    if (!win) return;
    if (win.classList.contains('nizar-minimized')) win.classList.remove('nizar-minimized');
    win.classList.toggle('nizar-maximized');
    if (!win.classList.contains('nizar-maximized')) {
      win.style.left = '';
      win.style.top = '';
      win.style.bottom = '';
    }
  }

  function toggleMinimize() {
    const win = document.getElementById('nizar-movies-window');
    if (!win) return;
    const shouldMinimize = !win.classList.contains('nizar-minimized');
    win.classList.toggle('nizar-minimized', shouldMinimize);
    if (shouldMinimize) {
      win.classList.remove('nizar-maximized');
      win.style.left = '';
      win.style.top = '';
      win.style.bottom = '';
    }
  }

  function openMoviesWindow(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
      if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
    }

    let win = document.getElementById('nizar-movies-window');
    if (win) {
      win.classList.remove('nizar-minimized');
      win.classList.add('nizar-visible');
      win.style.zIndex = String(2147483000 + Math.floor(Math.random() * 100));
      return;
    }

    win = document.createElement('section');
    win.id = 'nizar-movies-window';
    win.setAttribute('role', 'dialog');
    win.setAttribute('aria-label', 'Movies');
    win.innerHTML = `
      <div class="nizar-movies-titlebar" data-nizar-window-drag>
        <div class="nizar-movies-controls">
          <button class="nizar-window-control nizar-window-close" type="button" aria-label="Close Movies" title="Close"></button>
          <button class="nizar-window-control nizar-window-max" type="button" aria-label="Maximize Movies" title="Maximize / Restore"></button>
          <button class="nizar-window-control nizar-window-min" type="button" aria-label="Minimize Movies" title="Minimize / Restore"></button>
        </div>
        <div class="nizar-movies-window-title">Movies</div>
      </div>
      <div class="nizar-movies-frame-wrap">
        <div class="nizar-movies-loading"><div><div class="nizar-movies-spinner"></div>Loading Movies…</div></div>
        <iframe class="nizar-movies-iframe" src="${MOVIES_URL}" title="Movies" allow="fullscreen; autoplay; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>`;

    document.body.appendChild(win);

    const iframe = win.querySelector('.nizar-movies-iframe');
    const loading = win.querySelector('.nizar-movies-loading');
    iframe.addEventListener('load', () => loading.classList.add('nizar-loaded'), { once: true });
    // Avoid a permanent loader if the browser delays the load event.
    setTimeout(() => loading.classList.add('nizar-loaded'), 6000);

    win.querySelector('.nizar-window-close').addEventListener('click', e => { e.stopPropagation(); closeMoviesWindow(); });
    win.querySelector('.nizar-window-max').addEventListener('click', e => { e.stopPropagation(); toggleMaximize(); });
    win.querySelector('.nizar-window-min').addEventListener('click', e => { e.stopPropagation(); toggleMinimize(); });
    win.querySelector('.nizar-movies-window-title').addEventListener('dblclick', e => { e.stopPropagation(); toggleMaximize(); });

    const titlebar = win.querySelector('[data-nizar-window-drag]');
    titlebar.addEventListener('dblclick', e => {
      if (e.target.closest('.nizar-movies-controls')) return;
      toggleMaximize();
    });

    titlebar.addEventListener('pointerdown', e => {
      if (e.target.closest('.nizar-movies-controls')) return;
      if (win.classList.contains('nizar-maximized') || win.classList.contains('nizar-minimized')) return;
      const rect = win.getBoundingClientRect();
      drag = { id: e.pointerId, dx: e.clientX - rect.left, dy: e.clientY - rect.top };
      titlebar.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    });
    titlebar.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const w = win.offsetWidth, h = win.offsetHeight;
      let x = e.clientX - drag.dx;
      let y = e.clientY - drag.dy;
      x = Math.max(0, Math.min(window.innerWidth - w, x));
      y = Math.max(30, Math.min(window.innerHeight - 42, y));
      win.style.left = `${x}px`;
      win.style.top = `${y}px`;
      win.style.bottom = 'auto';
      win.style.transform = 'none';
    });
    const endDrag = e => {
      if (!drag || (e.pointerId != null && drag.id !== e.pointerId)) return;
      drag = null;
    };
    titlebar.addEventListener('pointerup', endDrag);
    titlebar.addEventListener('pointercancel', endDrag);

    requestAnimationFrame(() => requestAnimationFrame(() => win.classList.add('nizar-visible')));
    requestAnimationFrame(suppressOriginalFavoritesWindow);
    setTimeout(suppressOriginalFavoritesWindow, 40);
    setTimeout(suppressOriginalFavoritesWindow, 180);
  }

  window.__nizarOpenMoviesWindow = function () {
    const authorizedAt = Number(window.__nizarMoviesAuthorizedAt || 0);
    if (!authorizedAt || performance.now() - authorizedAt > 1800) return;
    window.__nizarMoviesAuthorizedAt = 0;
    openMoviesWindow();
    requestAnimationFrame(suppressOriginalFavoritesWindow);
    setTimeout(suppressOriginalFavoritesWindow, 40);
    setTimeout(suppressOriginalFavoritesWindow, 180);
  };

  function markMoviesApp() {
    scheduled = false;
    const candidates = new Set();

    // Discover ONLY from the actual visible movie icon or its visible label.
    document.querySelectorAll('img').forEach(img => {
      if (nizarIsMovieImage(img)) {
        const root = nizarMovieSmallRoot(img);
        if (root) candidates.add(root);
      }
    });
    document.querySelectorAll('p,span').forEach(el => {
      if (nizarIsMovieLabel(el)) {
        const root = nizarMovieSmallRoot(el);
        if (root) candidates.add(root);
      }
    });

    candidates.forEach(app => {
      if (!(app instanceof HTMLElement)) return;
      const r = app.getBoundingClientRect();
      if (!r.width || !r.height || r.width > 190 || r.height > 190) return;

      app.dataset.nizarMoviesHotspot = 'true';
      app.dataset.nizarMoviesApp = 'true';
      app.setAttribute('role', 'button');
      app.setAttribute('aria-label', 'Open Movies');
      if (!app.hasAttribute('tabindex')) app.setAttribute('tabindex', '0');

      const links = app.matches('a') ? [app] : Array.from(app.querySelectorAll('a'));
      links.forEach(link => {
        link.setAttribute('href', '#movies');
        link.setAttribute('target', '_self');
        link.dataset.nizarMoviesHotspot = 'true';
      });

      app.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        if (/PWuUiO2aouvctH4NNK1MNPe9o|sXPlJD56ya7bPccebTOcaoSqJ48|movies-icon\.png/.test(src)) {
          if (!src.includes('movies-icon.png')) img.setAttribute('src', ICON_URL);
          img.removeAttribute('srcset');
          img.setAttribute('alt', 'Movies');
        }
      });

      app.querySelectorAll('p,span').forEach(t => {
        if ((t.textContent || '').trim() === 'Interstellar') t.textContent = 'Movies';
      });
    });
  }

  function schedulePatch() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(markMoviesApp);
  }

  // Desktop icons in Framer are draggable, so distinguish a click from a drag.
  document.addEventListener('pointerdown', event => {
    const target = isMoviesElement(event.target);
    if (!target) { press = null; return; }
    press = { id: event.pointerId, x: event.clientX, y: event.clientY, t: performance.now(), target };
  }, true);

  document.addEventListener('pointerup', event => {
    if (!press || press.id !== event.pointerId) return;
    const current = isMoviesElement(event.target);
    const dx = event.clientX - press.x;
    const dy = event.clientY - press.y;
    const dt = performance.now() - press.t;
    const sameApp = current && (current === press.target || current.closest?.('[data-nizar-movies-app="true"]') === press.target || press.target.contains?.(current));
    press = null;
    if (sameApp && Math.hypot(dx, dy) <= 14 && dt <= 1200) {
      window.__nizarMoviesAuthorizedAt = performance.now();
      openMoviesWindow(event);
    }
  }, true);

  document.addEventListener('pointercancel', () => { press = null; }, true);

  document.addEventListener('click', event => {
    if (isMoviesElement(event.target)) {
      window.__nizarMoviesAuthorizedAt = performance.now();
      openMoviesWindow(event);
    }
  }, true);

  document.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    if (isMoviesElement(event.target)) {
      window.__nizarMoviesAuthorizedAt = performance.now();
      openMoviesWindow(event);
    }
  }, true);

  // Escape closes the Movies window.
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && document.getElementById('nizar-movies-window')) closeMoviesWindow();
  });

  const observer = new MutationObserver(() => {
    schedulePatch();
    if (document.getElementById('nizar-movies-window')) suppressOriginalFavoritesWindow();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedulePatch, { once: true });
  schedulePatch();
  setTimeout(schedulePatch, 500);
  setTimeout(schedulePatch, 1500);
})();
</script>

  .nz-mail-view{padding:8px 7px}.nz-mail-back{border:0;background:transparent;padding:4px 0 14px;font:650 11px Inter;cursor:pointer}.nz-mail-meta{background:#fff;border:1px solid #ddd;border-radius:13px;padding:13px;display:flex;gap:11px;align-items:center}.nz-mail-meta div{min-width:0}.nz-mail-meta b,.nz-mail-meta span{display:block}.nz-mail-meta b{font-size:12px}.nz-mail-meta span{font-size:9px;color:#999;margin-top:3px}.nz-mail-subject{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:19px 3px 12px}.nz-mail-message{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;min-height:165px;font-size:13px;line-height:1.65;white-space:normal;overflow-wrap:anywhere}.nz-mail-noreply{font-size:9px;color:#aaa;margin:9px 4px}.nz-mail-compose{padding:5px;max-width:620px}.nz-mail-compose h2{font-size:19px;margin:0 0 13px}.nz-mail-label{font-size:10px;color:#777;margin:9px 2px 5px}.nz-mail-input,.nz-mail-textarea{width:100%;box-sizing:border-box;border:1px solid #d5d5d0;background:#fff;border-radius:11px;padding:11px 12px;font:12px Inter;outline:none}.nz-mail-input:focus,.nz-mail-textarea:focus{border-color:#8c8c87}.nz-mail-textarea{height:185px;resize:none;line-height:1.5}.nz-mail-send{width:100%;height:42px;border:0;border-radius:11px;background:#171717;color:#fff;font:650 11px Inter;cursor:pointer;margin-top:11px}.nz-mail-status{height:18px;font-size:10px;margin-top:7px;color:#777}.nz-mail-toast{position:absolute;right:18px;bottom:18px;background:#171717;color:#fff;border-radius:10px;padding:9px 12px;font-size:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:nzToast .2s ease-out}@keyframes nzToast{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media(max-width:650px){#${APP_ID}{width:94vw;height:82vh}.nz-mail-sidebar{width:145px}.nz-mail-brand strong{font-size:15px}.nz-mail-codebox{padding:8px}.nz-mail-toolbar{padding:0 12px}.nz-mail-content{padding:10px}}
  `;
  if (!document.getElementById(style.id)) document.head.appendChild(style);

  let currentCode = "";
  let activeView = "inbox";
  let drag = null;

  function app(){ return document.getElementById(APP_ID); }
  function closeApp(){ app()?.remove(); }
  function toast(text){ const w=app(); if(!w) return; w.querySelector('.nz-mail-toast')?.remove(); const t=document.createElement('div'); t.className='nz-mail-toast'; t.textContent=text; w.appendChild(t); setTimeout(()=>t.remove(),1800); }
  function formatDate(iso){ const d=new Date(iso); return d.toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

  function shell(){
    const w = app();
    w.innerHTML = `<div class="nz-mail-titlebar"><div class="nz-mail-controls"><button class="nz-mail-ctrl nz-mail-close" aria-label="Close"></button><button class="nz-mail-ctrl nz-mail-minimize" aria-label="Minimize"></button><button class="nz-mail-ctrl nz-mail-maximize" aria-label="Maximize"></button></div><div class="nz-mail-window-title">Contact Mail</div></div><div class="nz-mail-body"></div>`;
    w.querySelector('.nz-mail-close').onclick = closeApp;
    w.querySelector('.nz-mail-minimize').onclick = () => w.classList.toggle('nz-mail-min');
    w.querySelector('.nz-mail-maximize').onclick = () => { w.classList.remove('nz-mail-min'); w.classList.toggle('nz-mail-max'); };
    const bar = w.querySelector('.nz-mail-titlebar');
    bar.ondblclick = (e) => { if(!e.target.closest('.nz-mail-controls')) w.querySelector('.nz-mail-maximize').click(); };
    bar.addEventListener('pointerdown', (e) => {
      if(e.button!==0 || e.target.closest('.nz-mail-controls') || w.classList.contains('nz-mail-max') || w.classList.contains('nz-mail-min')) return;
      const r=w.getBoundingClientRect(); drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};
      w.style.left=r.left+'px'; w.style.top=r.top+'px'; w.style.transform='none'; bar.setPointerCapture?.(e.pointerId); e.preventDefault();
    });
    bar.addEventListener('pointermove', e=>{ if(!drag)return; w.style.left=Math.max(0,drag.left+e.clientX-drag.x)+'px'; w.style.top=Math.max(30,drag.top+e.clientY-drag.y)+'px'; });
    bar.addEventListener('pointerup', ()=>drag=null); bar.addEventListener('pointercancel', ()=>drag=null);
  }

  function loginView(){
    activeView = 'login';
    const body=app().querySelector('.nz-mail-body');
    const remembered=localStorage.getItem(USER_KEY)||'';
    body.innerHTML=`<section class="nz-mail-login"><div class="nz-mail-login-icon">✉</div><h2>Open your mailbox</h2><p>Enter your personal code to see messages sent to that code. You can also send a new message to someone else's code.</p><input class="nz-mail-code-input" maxlength="24" autocomplete="off" placeholder="YOUR CODE" value="${esc(remembered)}"><button class="nz-mail-open-btn">Open mailbox</button><small class="nz-mail-login-note">Prototype mode: messages are stored on this browser until we connect the real database.</small></section>`;
    const input=body.querySelector('.nz-mail-code-input');
    const go=()=>{ const code=normalizeCode(input.value); if(!code){ input.focus(); return; } currentCode=code; localStorage.setItem(USER_KEY,code); inboxShell(); };
    body.querySelector('.nz-mail-open-btn').onclick=go; input.onkeydown=e=>{if(e.key==='Enter')go()}; setTimeout(()=>input.focus(),20);
  }

  function inboxShell(){
    activeView='inbox';
    const body=app().querySelector('.nz-mail-body');
    body.innerHTML=`<aside class="nz-mail-sidebar"><div class="nz-mail-brand"><strong>Mailbox</strong><small>one-way messages</small></div><div class="nz-mail-codebox"><span>Your code</span><b>${esc(currentCode)}</b></div><button class="nz-mail-nav active" data-view="inbox">Inbox</button><button class="nz-mail-nav" data-view="compose">New message</button><button class="nz-mail-switch">Switch mailbox code</button></aside><section class="nz-mail-main"><div class="nz-mail-toolbar"><strong>Inbox</strong><button class="nz-mail-compose-btn">＋ New message</button></div><div class="nz-mail-content"></div></section>`;
    body.querySelector('[data-view="inbox"]').onclick=renderInbox;
    body.querySelector('[data-view="compose"]').onclick=renderCompose;
    body.querySelector('.nz-mail-compose-btn').onclick=renderCompose;
    body.querySelector('.nz-mail-switch').onclick=()=>{currentCode='';loginView()};
    renderInbox();
  }

  function content(){ return app()?.querySelector('.nz-mail-content'); }
  function setToolbar(title, compose=true){ const w=app(); if(!w)return; const t=w.querySelector('.nz-mail-toolbar strong'); if(t)t.textContent=title; const b=w.querySelector('.nz-mail-compose-btn'); if(b)b.style.display=compose?'':'none'; w.querySelectorAll('.nz-mail-nav').forEach(n=>n.classList.toggle('active', (title==='Inbox'&&n.dataset.view==='inbox')||(title==='New message'&&n.dataset.view==='compose'))); }

  function renderInbox(){
    activeView='inbox'; setToolbar('Inbox',true);
    const c=content(); if(!c)return;
    const items=loadMessages().filter(m=>normalizeCode(m.to)===currentCode).sort((a,b)=>new Date(b.time)-new Date(a.time));
    if(!items.length){ c.innerHTML=`<div class="nz-mail-empty"><i>✉</i><strong>No messages yet</strong><span>Messages sent to ${esc(currentCode)} will appear here.</span></div>`; return; }
    c.innerHTML=items.map(m=>`<button class="nz-mail-row" data-id="${esc(m.id)}"><span class="nz-mail-envelope">✉</span><span class="nz-mail-row-text"><b>From ${esc(m.from)}</b><span>${esc(m.subject||'No subject')}</span><small>${esc(formatDate(m.time))} · ${esc((m.text||'').slice(0,70))}</small></span><span class="nz-mail-chevron">›</span></button>`).join('');
    c.querySelectorAll('.nz-mail-row').forEach(row=>row.onclick=()=>{const m=loadMessages().find(x=>x.id===row.dataset.id); if(m)renderRead(m)});
  }

  function renderRead(m){
    activeView='read'; setToolbar('Message',true);
    const c=content();
    c.innerHTML=`<div class="nz-mail-view"><button class="nz-mail-back">← Inbox</button><div class="nz-mail-meta"><span class="nz-mail-envelope">✉</span><div><b>From ${esc(m.from)}</b><span>To ${esc(m.to)} · ${esc(formatDate(m.time))}</span></div></div><div class="nz-mail-subject">${esc(m.subject||'No subject')}</div><article class="nz-mail-message">${esc(m.text||'').replace(/\n/g,'<br>')}</article><div class="nz-mail-noreply">No reply button — messages are one-way. To send something back, create a new message manually.</div></div>`;
    c.querySelector('.nz-mail-back').onclick=renderInbox;
  }

  function renderCompose(){
    activeView='compose'; setToolbar('New message',false);
    const c=content();
    c.innerHTML=`<div class="nz-mail-compose"><button class="nz-mail-back">← Inbox</button><h2>New message</h2><div class="nz-mail-label">Recipient code</div><input class="nz-mail-input nz-mail-to" maxlength="24" autocomplete="off" placeholder="ENTER CODE"><div class="nz-mail-label">Subject</div><input class="nz-mail-input nz-mail-subject-input" maxlength="80" placeholder="Subject"><div class="nz-mail-label">Message</div><textarea class="nz-mail-textarea" maxlength="5000" placeholder="Write your message..."></textarea><button class="nz-mail-send">Send message</button><div class="nz-mail-status"></div></div>`;
    c.querySelector('.nz-mail-back').onclick=renderInbox;
    c.querySelector('.nz-mail-send').onclick=()=>{
      const to=normalizeCode(c.querySelector('.nz-mail-to').value);
      const subject=c.querySelector('.nz-mail-subject-input').value.trim();
      const text=c.querySelector('.nz-mail-textarea').value.trim();
      const status=c.querySelector('.nz-mail-status');
      if(!to||!text){status.textContent='Enter a recipient code and a message.';return;}
      const items=loadMessages(); items.push({id:uid(),from:currentCode,to,subject,text,time:new Date().toISOString()}); saveMessages(items);
      status.textContent='Message sent.'; toast('Message sent'); setTimeout(renderInbox,450);
    };
    setTimeout(()=>c.querySelector('.nz-mail-to')?.focus(),20);
  }

  function openApp(){
    if(app()){ app().classList.remove('nz-mail-min'); return; }
    const w=document.createElement('section'); w.id=APP_ID; document.body.appendChild(w); shell();
    currentCode=normalizeCode(localStorage.getItem(USER_KEY)||'');
    if(currentCode) inboxShell(); else loginView();
  }

  function isContactTarget(target){
    const el=target?.closest?.(CONTACT_SELECTORS); if(!el)return false;
    return el.matches('[data-framer-name="contact"],[name="contact"]') || !!el.closest('[data-framer-name="contact"],[name="contact"]') || el.classList.contains('framer-ssfp21-container');
  }
  function intercept(e){
    if(e.target?.closest?.('#'+APP_ID))return;
    if(!isContactTarget(e.target))return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation?.(); openApp();
  }

  window.addEventListener('click',intercept,true);
  window.addEventListener('pointerup',intercept,true);
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&app())closeApp()});

  function patchContact(){
    document.querySelectorAll('[data-framer-name="contact"],[name="contact"]').forEach(el=>{
      el.style.cursor='pointer'; el.setAttribute('data-nz-mail-trigger','1');
      if(el.dataset.nzMailBound)return; el.dataset.nzMailBound='1';
      el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openApp()},true);
    });
    // If the old Framer contact form/window appears, hide only that old content.
    document.querySelectorAll('body *').forEach(el=>{
      if(el.closest?.('#'+APP_ID))return;
      const t=(el.innerText||'').trim();
      if(t.length>35 && /Get In Touch:/i.test(t) && /Enter your message/i.test(t) && /Submit/i.test(t)) el.style.display='none';
    });
  }
  const obs=new MutationObserver(patchContact); obs.observe(document.documentElement,{childList:true,subtree:true});
  patchContact(); setTimeout(patchContact,500); setTimeout(patchContact,1800);
})();</script>

<script id="nizar-ourdays-patch">
(() => {
  const START = { y: 2020, m: 0, d: 1 };
  let drag = null;

  function dateStats() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    const todayUTC = Date.UTC(y,m,d);
    const startUTC = Date.UTC(START.y,START.m,START.d);
    const daysTogether = Math.floor((todayUTC-startUTC)/86400000) + 1;

    let years = y - START.y;
    let months = m - START.m;
    let days = d - START.d;
    if (days < 0) {
      months--;
      const prevMonthDays = new Date(y, m, 0).getDate();
      days += prevMonthDays;
    }
    if (months < 0) { years--; months += 12; }

    let nextYear = y;
    const anniversaryUTCThisYear = Date.UTC(y, START.m, START.d);
    if (todayUTC > anniversaryUTCThisYear) nextYear++;
    const nextAnnivUTC = Date.UTC(nextYear, START.m, START.d);
    const until = Math.round((nextAnnivUTC-todayUTC)/86400000);
    return { daysTogether, years, months, days, until, nextYear, anniversaryNumber: nextYear-START.y };
  }

  function updateStats() {
    const win = document.getElementById('nizar-ourdays-window');
    if (!win) return;
    const st = dateStats();
    const n = win.querySelector('[data-days-together]');
    const exact = win.querySelector('[data-exact-duration]');
    const next = win.querySelector('[data-next-anniversary]');
    const nextNote = win.querySelector('[data-next-note]');
    if (n) n.textContent = st.daysTogether.toLocaleString();
    if (exact) exact.textContent = `${st.years} years · ${st.months} months · ${st.days} days`;
    if (next) next.textContent = st.until === 0 ? 'Today ♥' : `${st.until} days`;
    if (nextNote) nextNote.textContent = st.until === 0 ? `${st.anniversaryNumber} years today` : `until ${st.anniversaryNumber} years together`;
  }

  function buildWindow() {
    let win = document.getElementById('nizar-ourdays-window');
    if (win) return win;
    win = document.createElement('section');
    win.id = 'nizar-ourdays-window';
    win.setAttribute('role','dialog');
    win.setAttribute('aria-label','Our Days');
    win.innerHTML = `
      <div class="nizar-ourdays-titlebar" data-ourdays-drag>
        <div class="nizar-ourdays-controls">
          <button class="nizar-ourdays-control nizar-ourdays-close" aria-label="Close" title="Close"></button>
          <button class="nizar-ourdays-control nizar-ourdays-min" aria-label="Minimize" title="Minimize"></button>
          <button class="nizar-ourdays-control nizar-ourdays-max" aria-label="Maximize" title="Maximize / Restore"></button>
        </div>
        <div class="nizar-ourdays-window-title">Our Days</div>
      </div>
      <div class="nizar-ourdays-body">
        <div class="nizar-ourdays-content">
          <div class="nizar-ourdays-kicker">Just us</div>
          <div class="nizar-ourdays-heading"><div class="nizar-ourdays-heart">♥</div><h1>Our Days</h1></div>
          <div class="nizar-ourdays-since">Together since January 1, 2020</div>
          <div class="nizar-ourdays-maincard">
            <div class="nizar-ourdays-mainlabel">Days together</div>
            <div class="nizar-ourdays-number"><b data-days-together>—</b><span>and counting</span></div>
            <div class="nizar-ourdays-sub" data-exact-duration>—</div>
          </div>
          <div class="nizar-ourdays-grid">
            <div class="nizar-ourdays-card">
              <div class="nizar-ourdays-card-label">Our first day</div>
              <div class="nizar-ourdays-card-value">01 · 01 · 2020</div>
              <div class="nizar-ourdays-card-note">Where our story started</div>
            </div>
            <div class="nizar-ourdays-card">
              <div class="nizar-ourdays-card-label">Next anniversary</div>
              <div class="nizar-ourdays-card-value" data-next-anniversary>—</div>
              <div class="nizar-ourdays-card-note" data-next-note>—</div>
            </div>
            <div class="nizar-ourdays-card">
              <div class="nizar-ourdays-card-label">Always</div>
              <div class="nizar-ourdays-card-value">You & Me</div>
              <div class="nizar-ourdays-card-note">One day at a time <span class="nizar-ourdays-tinyheart">♥</span></div>
            </div>
          </div>
          <div class="nizar-ourdays-footer"><span>Our story keeps counting automatically.</span><span>Since 2020 ♥</span></div>
        </div>
      </div>`;
    document.body.appendChild(win);

    win.querySelector('.nizar-ourdays-close').addEventListener('click', e => { e.stopPropagation(); closeWindow(); });
    win.querySelector('.nizar-ourdays-min').addEventListener('click', e => { e.stopPropagation(); toggleMin(); });
    win.querySelector('.nizar-ourdays-max').addEventListener('click', e => { e.stopPropagation(); toggleMax(); });
    win.querySelector('.nizar-ourdays-window-title').addEventListener('dblclick', e => { e.stopPropagation(); toggleMax(); });

    const bar = win.querySelector('[data-ourdays-drag]');
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.nizar-ourdays-controls') || win.classList.contains('nizar-maximized') || win.classList.contains('nizar-minimized')) return;
      const r = win.getBoundingClientRect();
      win.style.left = `${r.left}px`; win.style.top = `${r.top}px`; win.style.transform='none';
      drag = { dx:e.clientX-r.left, dy:e.clientY-r.top };
      try { bar.setPointerCapture(e.pointerId); } catch(_) {}
    });
    bar.addEventListener('pointermove', e => {
      if (!drag) return;
      const x = Math.min(window.innerWidth-120, Math.max(-win.offsetWidth+120, e.clientX-drag.dx));
      const y = Math.min(window.innerHeight-54, Math.max(0, e.clientY-drag.dy));
      win.style.left = `${x}px`; win.style.top = `${y}px`;
    });
    bar.addEventListener('pointerup', () => { drag = null; });
    return win;
  }

  function suppressOriginalAboutWindow() {
    // Safety net: if Framer still creates its original About Me portfolio window,
    // hide only that legacy OS window and keep the custom Our Days window.
    const custom = document.getElementById('nizar-ourdays-window');

    // Best path: Framer mounts app windows inside the #overlay portal.
    const overlay = document.getElementById('overlay');
    if (overlay) {
      Array.from(overlay.children).forEach(child => {
        if (!(child instanceof HTMLElement) || child === custom || child.contains(custom)) return;
        const txt = (child.innerText || child.textContent || '').replace(/\\s+/g,' ').trim();
        if (/About Me/i.test(txt) && /Services/i.test(txt) && /Projects/i.test(txt)) {
          child.style.setProperty('display','none','important');
          child.style.setProperty('pointer-events','none','important');
          child.setAttribute('aria-hidden','true');
          child.setAttribute('data-nizar-suppressed-about','true');
        }
      });
    }

    // Fallback for hydrated variants where the portal structure/names differ.
    document.querySelectorAll('h1,h2,h3,p,span,div').forEach(el => {
      if (!(el instanceof HTMLElement) || el.closest('#nizar-ourdays-window')) return;
      if ((el.textContent || '').trim() !== 'About Me') return;
      let node = el;
      let candidate = null;
      for (let i=0; node && node !== document.body && i<14; i++, node=node.parentElement) {
        if (!(node instanceof HTMLElement)) continue;
        const txt=(node.innerText || node.textContent || '').replace(/\\s+/g,' ');
        if (!/Services/i.test(txt) || !/Projects/i.test(txt)) continue;
        const style=getComputedStyle(node), rect=node.getBoundingClientRect();
        if ((style.position==='fixed' || style.position==='absolute') && rect.width>420 && rect.height>260) {
          candidate=node;
        }
      }
      if (candidate) {
        candidate.style.setProperty('display','none','important');
        candidate.style.setProperty('pointer-events','none','important');
        candidate.setAttribute('aria-hidden','true');
        candidate.setAttribute('data-nizar-suppressed-about','true');
      }
    });
  }

  function openWindow() {
    suppressOriginalAboutWindow();
    const win = buildWindow();
    win.classList.remove('nizar-minimized');
    updateStats();
    requestAnimationFrame(() => win.classList.add('nizar-visible'));
  }
  function closeWindow() {
    const win = document.getElementById('nizar-ourdays-window');
    if (!win) return;
    win.classList.remove('nizar-visible');
  }
  function resetPosition(win) {
    win.style.left='50%'; win.style.top='50%'; win.style.right=''; win.style.bottom=''; win.style.transform='';
  }
  function toggleMax() {
    const win=buildWindow();
    win.classList.remove('nizar-minimized');
    if (win.classList.toggle('nizar-maximized')) { win.style.left='';win.style.top='';win.style.transform=''; }
    else resetPosition(win);
  }
  function toggleMin() {
    const win=buildWindow();
    if (win.classList.contains('nizar-minimized')) { win.classList.remove('nizar-minimized'); resetPosition(win); }
    else { win.classList.remove('nizar-maximized'); win.classList.add('nizar-minimized'); win.style.left='';win.style.top='';win.style.transform=''; }
  }

  window.__nizarOpenOurDaysWindow = openWindow;

  function markApps() {
    const candidates = new Set();
    document.querySelectorAll('[data-framer-name="about"], [name="about"], .framer-1hiogi0-container, [data-framer-name="Tips"], [name="Tips"], .framer-12rwxs8-container').forEach(el => candidates.add(el));
    document.querySelectorAll('p,span').forEach(t => {
      const txt=(t.textContent||'').trim();
      if (txt==='About' || txt==='About Me' || txt==='Our Days') {
        const app=t.closest('[data-framer-name="about"], [name="about"], .framer-1hiogi0-container, [data-framer-name="Tips"], [name="Tips"], .framer-12rwxs8-container, a');
        if (app) candidates.add(app);
        // Only mutate when the label actually needs changing. Re-writing
        // "Our Days" continuously retriggers the MutationObserver and can
        // lock the page on the Hello/loading screen.
        if (txt !== 'Our Days') t.textContent='Our Days';
      }
    });
    candidates.forEach(el => {
      if (!(el instanceof HTMLElement)) return;
      el.dataset.nizarOurdaysApp='true';
      el.setAttribute('aria-label','Open Our Days');
    });
  }

  let suppressQueued = false;
  const observer = new MutationObserver(() => {
    markApps();
    if (!suppressQueued) {
      suppressQueued = true;
      requestAnimationFrame(() => { suppressQueued = false; suppressOriginalAboutWindow(); });
    }
  });
  observer.observe(document.documentElement,{childList:true,subtree:true});
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', markApps, {once:true}); else markApps();
  setTimeout(() => { markApps(); suppressOriginalAboutWindow(); },400);
  setTimeout(() => { markApps(); suppressOriginalAboutWindow(); },1400);
  setTimeout(suppressOriginalAboutWindow,2400);
  setInterval(updateStats, 60000);
  if (window.__nizarOurDaysPending) { window.__nizarOurDaysPending=false; openWindow(); }
})();
</script>

<style id="nizar-removed-apps-style">
  .nizar-removed-desktop-app { display:none !important; visibility:hidden !important; pointer-events:none !important; }
  #plinq-project-1h5pmyl, #sorae-project-ygavp9, #laver-project-1invank,
  #nuvio-project-cwolws, #veyra-project-q0hz5e { display:none !important; visibility:hidden !important; pointer-events:none !important; }
</style>
<script id="nizar-remove-unused-apps">
(() => {
  const REMOVED = new Set(['Framer','Figma','Plinq','Sorae','Laver','Atria','Atriq','Nuvio','Veyra','Resume','Resources']);

  function findAppRoot(label) {
    if (!(label instanceof Element)) return null;
    // Portfolio/CMS project icons have stable project wrappers.
    const project = label.closest('[id*="-project-"]');
    if (project) return project;

    let node = label;
    for (let i=0; node && node !== document.body && i<10; i++, node=node.parentElement) {
      if (!(node instanceof HTMLElement)) continue;
      const name = (node.getAttribute('data-framer-name') || '').trim();
      const inline = node.getAttribute('style') || '';
      if (REMOVED.has(name)) return node;
      if (/touch-action\s*:\s*none/i.test(inline) && /user-select\s*:\s*none/i.test(inline)) return node;
    }

    const anchor = label.closest('a');
    return anchor ? (anchor.parentElement || anchor) : null;
  }

  function removeUnusedApps() {
    document.querySelectorAll('p,span').forEach(label => {
      const text = (label.textContent || '').trim();
      if (!REMOVED.has(text)) return;
      const root = findAppRoot(label);
      if (!root || root.closest('#nizar-movies-window,#nizar-ourdays-window,#nizar-mail-window')) return;
      if (root.dataset.nizarRemovedDesktopApp === '1') return;
      root.dataset.nizarRemovedDesktopApp = '1';
      root.classList.add('nizar-removed-desktop-app');
      root.setAttribute('aria-hidden','true');
    });
  }

  let queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued=false; removeUnusedApps(); });
  }

  const observer = new MutationObserver(schedule);
  observer.observe(document.documentElement, {childList:true, subtree:true});
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule, {once:true});
  schedule();
  setTimeout(schedule, 300);
  setTimeout(schedule, 1200);
})();
</script>

<script id="nizar-soon-badge-script">
(()=>{
  // These are the four visible dock icons in the screenshot: About, Projects, Gallery, Reel.
  // Contact/Mail is deliberately NOT included so the mailbox keeps working.
  const PLACEHOLDERS = [
    '[data-framer-name="about"]', '[name="about"]', '.framer-1hiogi0-container',
    '[data-framer-name="projects"]', '[name="projects"]', '.framer-zv3l8f-container',
    '.framer-7bu31p-container',
    '[data-framer-name="services"]', '[name="services"]', '.framer-1sm19hr-container'
  ].join(',');

  let toastTimer = 0;
  let lastShown = 0;

  function removeBadge(){
    document.querySelectorAll('#__framer-badge-container, .__framer-badge').forEach(el=>{
      el.style.setProperty('display','none','important');
      el.style.setProperty('visibility','hidden','important');
      el.style.setProperty('pointer-events','none','important');
      el.setAttribute('aria-hidden','true');
    });
  }

  function getToast(){
    let t=document.getElementById('nizar-soon-toast');
    if(!t){
      t=document.createElement('div');
      t.id='nizar-soon-toast';
      t.textContent='Soon';
      t.setAttribute('role','status');
      t.setAttribute('aria-live','polite');
      document.body.appendChild(t);
    }
    return t;
  }

  function showSoon(){
    const now=Date.now();
    if(now-lastShown < 180) return;
    lastShown=now;
    const t=getToast();
    clearTimeout(toastTimer);
    t.classList.add('nz-show');
    toastTimer=setTimeout(()=>t.classList.remove('nz-show'),1100);
  }

  function placeholderFrom(target){
    const el=target?.closest?.(PLACEHOLDERS);
    if(!el) return null;
    // Only act when the match belongs to the bottom DockNav, never similarly-named content elsewhere.
    return el.closest?.('[data-framer-name="DockNav"]') ? el : null;
  }

  function blockOldAction(e){
    const el=placeholderFrom(e.target);
    if(!el) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    if(e.type==='pointerup' || e.type==='click') showSoon();
  }

  // Capture phase prevents Framer's original apps/windows from opening.
  window.addEventListener('pointerup', blockOldAction, true);
  window.addEventListener('click', blockOldAction, true);
  window.addEventListener('auxclick', blockOldAction, true);

  // Keyboard support for the dock placeholders.
  window.addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const el=placeholderFrom(e.target);
    if(!el) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation?.(); showSoon();
  }, true);

  const mo=new MutationObserver(removeBadge);
  mo.observe(document.documentElement,{childList:true,subtree:true});
  removeBadge();
  setTimeout(removeBadge,400);
  setTimeout(removeBadge,1600);
})();
</script>
